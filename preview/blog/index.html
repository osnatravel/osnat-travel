<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הבלוג | OSNAT TRAVEL</title><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Cinzel:wght@600&display=swap" rel="stylesheet"><style>
:root{--navy:#0b1b33;--navy2:#132a4d;--gold:#d4af37;--gold2:#f3d77a}*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',sans-serif;background:#f7f3ea;color:var(--navy);line-height:1.7}
a{color:#8a6d12}
.top{background:var(--navy);border-bottom:2px solid var(--gold);padding:10px 18px;display:flex;align-items:center;gap:12px}
.top img{height:46px}.top span{font-family:'Cinzel',serif;color:var(--gold);letter-spacing:2px;font-size:15px}
.hb-bar{position:fixed;top:10px;left:10px;z-index:99;display:flex;gap:6px}
.hb-bar a{padding:7px 14px;border-radius:999px;font:600 14px/1 'Heebo',sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.hb-home{background:var(--navy);color:var(--gold)!important;border:1.5px solid var(--gold)}.hb-all{background:var(--gold);color:var(--navy)!important;border:1.5px solid var(--navy)}
.hero{position:relative;height:62vh;min-height:360px;background:url(img/parliament.jpg) center/cover;display:flex;align-items:flex-end}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,27,51,.92),rgba(11,27,51,.15))}
.hero .in{position:relative;color:#fff;padding:30px 24px;max-width:1100px;margin:0 auto;width:100%}
.hero small{color:var(--gold2);letter-spacing:2px;font-weight:600}.hero h1{font-size:clamp(32px,6vw,58px);margin:6px 0;line-height:1.15}.hero p{font-size:19px;margin:0;opacity:.92}
.hero .cr{position:absolute;bottom:6px;left:10px}
.wrap{max-width:1100px;margin:0 auto;padding:10px 20px 40px}
h2{font-size:30px;margin:46px 0 14px;display:flex;align-items:center;gap:12px}h2:after{content:"";flex:1;height:2px;background:linear-gradient(to left,transparent,var(--gold))}
.intro{font-size:19px;background:#fff;border-right:4px solid var(--gold);padding:22px 26px;border-radius:14px;box-shadow:0 6px 24px rgba(11,27,51,.08);margin-top:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(11,27,51,.1);position:relative;display:flex;flex-direction:column}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card .cr{position:absolute;top:196px;left:0;right:0}
.cb{padding:18px 20px 20px;position:relative}.cb h3{margin:4px 0 6px;font-size:21px}.cb p{margin:0 0 10px;color:#3a4a63}
.num{position:absolute;top:-22px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--gold);border:2px solid var(--gold);display:grid;place-items:center;font-weight:800}
.tip{background:#fbf6e6;border:1px dashed #e3d6ad;border-radius:10px;padding:10px 12px;font-size:15px}
.cr{font-size:11px;color:#fff;background:rgba(11,27,51,.7);padding:3px 8px;direction:ltr;text-align:left}.cr a{color:var(--gold2)}
.rest{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.r{background:#fff;border-radius:14px;padding:18px 20px;border-top:3px solid var(--gold);box-shadow:0 4px 18px rgba(11,27,51,.07)}.r h3{margin:0 0 4px}.r p{margin:0;color:#3a4a63}
.badge{display:inline-block;background:var(--navy);color:var(--gold2);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;margin-bottom:6px}
.note{color:#6b7a90;font-size:14px;margin-top:10px}
.info{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:10px 26px}.info h3{color:var(--gold)}.info p{opacity:.92}
ol.tips{counter-reset:t;list-style:none;padding:0}ol.tips li{counter-increment:t;background:#fff;margin:10px 0;padding:14px 18px 14px 18px;border-radius:12px;box-shadow:0 3px 14px rgba(11,27,51,.06);position:relative;padding-right:60px}
ol.tips li:before{content:counter(t);position:absolute;right:16px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;display:grid;place-items:center}
.cta{margin:50px 0 10px;background:radial-gradient(circle at 50% 0,#1d3a66 0,var(--navy) 70%);color:#fff;text-align:center;padding:40px 20px;border-radius:22px;border:2px solid var(--gold)}
.cta h2{justify-content:center;margin:0 0 8px;color:var(--gold2)}.cta h2:after{display:none}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}.btns a{padding:12px 22px;border-radius:12px;font-weight:700;text-decoration:none}
.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}.ghost{border:1.5px solid var(--gold);color:var(--gold2)}
.src{font-size:13px;color:#3a4a63;word-break:break-all}.src ul{padding-right:18px}
footer{text-align:center;padding:24px;color:#6b7a90;font-size:13px}
@media(max-width:600px){.top img{height:38px}.top span{display:none}.hero{height:52vh}.hero p{font-size:16px}h2{font-size:24px}.intro{font-size:17px}.hb-bar a{font-size:12px;padding:6px 10px}}

.bh{background:radial-gradient(circle at 50% 0,#1d3a66 0,var(--navy) 70%);color:#fff;text-align:center;padding:50px 20px;border-bottom:3px solid var(--gold)}.bh h1{margin:0;font-size:42px}.bh p{color:var(--gold2)}.card{text-decoration:none;color:inherit}</style></head><body>
