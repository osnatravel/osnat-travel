<style>
:root{--navy:#0B1626;--navy2:#13233B;--gold:#C9A45C;--gold2:#E8CF94;--cream:#FBF7EF;--ink:#1B2433}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Heebo,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7}
a{color:inherit;text-decoration:none}
.hero{position:relative;color:#fff;text-align:center;padding:90px 20px 80px;background:linear-gradient(rgba(11,22,38,.78),rgba(11,22,38,.88)),url(/assets/slide-city.jpg) center/cover;border-bottom:3px solid var(--gold)}
.eb{color:var(--gold2);letter-spacing:.25em;font-size:14px;font-weight:500}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;margin:8px 0 10px}
.hero p{max-width:620px;margin:auto;color:#D9E0EA;font-size:1.1rem}
.rule{width:64px;height:1px;background:var(--gold);margin:20px auto 0;position:relative}.rule:after{content:"";position:absolute;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);top:-3px;left:calc(50% - 3.5px)}
.wrap{max-width:1180px;margin:auto;padding:56px 20px 80px}
.grid{display:grid;grid-template-columns:1fr;gap:28px}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:22px;overflow:hidden;border:1px solid rgba(201,164,92,.3);box-shadow:0 12px 32px rgba(11,22,38,.08);display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(11,22,38,.16)}
.ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--navy2)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}.card:hover .ph img{transform:scale(1.07)}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(11,22,38,.6))}
.tag{position:absolute;z-index:1;top:14px;right:14px;background:rgba(11,22,38,.85);color:var(--gold2);font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px}
.bd{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}
.bd h2{font-size:1.4rem;font-weight:800;color:var(--navy);line-height:1.35}
.bd p{color:#4A5568;margin:10px 0 18px;flex:1}
.more{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);font-weight:700;transition:gap .25s}
.card:hover .more{gap:14px}
.cr{font-size:11px;color:#8A94A3;padding:0 22px 12px;direction:ltr;text-align:left}.cr a{text-decoration:underline}
footer{background:#070F1B;color:#B8C2CF;text-align:center;padding:36px 20px;font-size:14px}

<main class="wrap"><div class="grid" id="posts"></div></main>

<script>
/* להוספת כתבה: מוסיפים אובייקט למערך (הכתבה החדשה ראשונה) */
var POSTS=[
 {url:"/blog/budapest/",
  img:"/blog/budapest/img/parliament.jpg", tag:"הונגריה",

];
document.getElementById('posts').innerHTML=POSTS.map(function(p){return '<article class="card"><a class="ph" href="'+p.url+'"><span class="tag">'+p.tag+'</span><img src="'+p.img+'" alt="'+p.title+'" loading="lazy"></a><div class="bd"><h2><a href="'+p.url+'">'+p.title+'</a></h2><p>'+p.teaser+'</p><a class="more" href="'+p.url+'">לקריאת הכתבה ←</a></div>'+(p.credit?'<div class="cr">'+p.credit+'</div>':'')+'</article>'}).join('');
</script></body></html>
