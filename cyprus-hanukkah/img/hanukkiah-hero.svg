<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D78E"/>
      <stop offset=".45" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B8862B"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
