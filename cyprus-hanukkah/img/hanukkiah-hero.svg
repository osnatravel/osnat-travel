    <rect x="105" y="70" width="10" height="80" rx="3" fill="url(#gold)"/>
    <rect x="131" y="90" width="10" height="60" rx="3" fill="url(#gold2)"/>
    <rect x="151" y="98" width="10" height="52" rx="3" fill="url(#gold2)"/>
